# kind = "Kubernetes IN Docker": a free, real Kubernetes cluster running inside Docker on your laptop.
# One control-plane node (also schedules pods) + 2 workers so rolling updates and scaling are visible.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"      # lets ingress-nginx run on this node
    extraPortMappings:
      - containerPort: 80
        hostPort: 8082                            # http://localhost:8082 -> Ingress
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
  - role: worker
  - role: worker

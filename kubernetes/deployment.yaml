# Deployments for backend and frontend. Replace the image tag with the one you pushed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-backend
  namespace: shop
  labels: { app: shop-backend }
spec:
  replicas: 2
  strategy:                             # ROLLING UPDATE: add 1 new pod, only then remove 1 old pod => zero downtime
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: shop-backend }
  template:
    metadata:
      labels: { app: shop-backend }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: backend
          image: localhost:5001/shop-backend:latest
          ports: [{ name: http, containerPort: 3000 }]
          envFrom:
            - configMapRef: { name: shop-config }
          env:
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: shop-secret, key: DB_PASSWORD } }
            - name: DATABASE_URL            # $(DB_PASSWORD) is expanded by Kubernetes from the env var above
              value: postgres://shop:$(DB_PASSWORD)@shop-postgres:5432/shop
          livenessProbe:  { httpGet: { path: /health, port: http }, initialDelaySeconds: 10, periodSeconds: 10 }
          readinessProbe: { httpGet: { path: /ready,  port: http }, initialDelaySeconds: 5,  periodSeconds: 5 }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-frontend
  namespace: shop
  labels: { app: shop-frontend }
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: shop-frontend }
  template:
    metadata:
      labels: { app: shop-frontend }
    spec:
      containers:
        - name: frontend
          image: localhost:5001/shop-frontend:latest
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /health, port: http }, periodSeconds: 5 }
          livenessProbe:  { httpGet: { path: /health, port: http }, initialDelaySeconds: 10, periodSeconds: 10 }
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }

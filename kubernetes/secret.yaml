# Secret = sensitive values. stringData lets us write plain text; Kubernetes stores it base64-encoded.
# DEMO VALUE ONLY. In real life create it out-of-band:
#   kubectl -n shop create secret generic shop-secret --from-literal=DB_PASSWORD="$(openssl rand -hex 16)"
# and never commit real passwords to Git.
apiVersion: v1
kind: Secret
metadata:
  name: shop-secret
  namespace: shop
type: Opaque
stringData:
  DB_PASSWORD: "demo-only-change-me"

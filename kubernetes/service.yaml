# Services give pods a stable DNS name + load-balancing.
# The Service called "backend" is what nginx.conf proxies to (http://backend:3000).
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: shop
spec:
  selector: { app: shop-backend }
  ports: [{ name: http, port: 3000, targetPort: http }]
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: shop
spec:
  selector: { app: shop-frontend }
  ports: [{ name: http, port: 80, targetPort: http }]

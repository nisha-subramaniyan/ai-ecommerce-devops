groups:
  - name: shop-alerts
    rules:
      - alert: BackendDown
        expr: up{job="shop-backend"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "Backend is down"
          description: "Prometheus cannot scrape the backend for 1 minute."

      - alert: HighErrorRate
        expr: |
          sum(rate(http_request_duration_seconds_count{status=~"5.."}[5m]))
            / clamp_min(sum(rate(http_request_duration_seconds_count[5m])), 1e-9) > 0.05
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "More than 5% of requests are failing (HTTP 5xx)"

      - alert: HighLatencyP95
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 1
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "95th percentile latency above 1 second"

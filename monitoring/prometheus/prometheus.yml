# Prometheus config for the Docker Compose environment.
# (On Kubernetes the same job is done by a ServiceMonitor from the Helm chart.)
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: shop-backend          # our app: /metrics endpoint added in application/backend/src/app.js
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:3000"]

  - job_name: prometheus            # Prometheus monitors itself
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: cadvisor              # per-container CPU / memory
    static_configs:
      - targets: ["cadvisor:8080"]

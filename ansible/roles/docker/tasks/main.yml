---
- name: Install Docker prerequisites
  ansible.builtin.apt: { name: [ca-certificates, curl, gnupg], state: present }

- name: Check whether Docker is already installed
  ansible.builtin.command: docker --version
  register: docker_check
  changed_when: false
  failed_when: false

- name: Install Docker Engine + Compose plugin using the official convenience script
  ansible.builtin.shell: curl -fsSL https://get.docker.com | sh
  args: { creates: /usr/bin/docker }
  when: docker_check.rc != 0

- name: Start and enable Docker
  ansible.builtin.service: { name: docker, state: started, enabled: true }
  when: ansible_facts.service_mgr | default('') == 'systemd'

- name: Allow deploy user to run docker
  ansible.builtin.user: { name: "{{ app_user }}", groups: docker, append: true }

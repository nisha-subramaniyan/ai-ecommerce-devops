# ELK = Elasticsearch (store/search) + Logstash (parse) + Kibana (UI), fed by Filebeat (collector).
# Needs ~3 GB free RAM. On Linux first run:  sudo sysctl -w vm.max_map_count=262144
#   docker compose -f logging/elk/docker-compose.elk.yml up -d
#   ./logging/elk/setup-kibana.sh            (creates the "shop-logs-*" data view)
# Kibana: http://localhost:5601        Elasticsearch: http://localhost:9200
name: elk
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.2
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"          # LAB ONLY: no auth. Never expose 9200 publicly.
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports: ["127.0.0.1:9200:9200"]
    volumes: [es-data:/usr/share/elasticsearch/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      retries: 20

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.2
    environment: { LS_JAVA_OPTS: "-Xms256m -Xmx256m" }
    volumes:
      - ./logstash/pipeline.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    depends_on:
      elasticsearch: { condition: service_healthy }

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.2
    environment: { ELASTICSEARCH_HOSTS: "http://elasticsearch:9200" }
    ports: ["127.0.0.1:5601:5601"]
    depends_on:
      elasticsearch: { condition: service_healthy }

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.15.2
    user: root                                  # must read other containers' log files
    command: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [logstash]

volumes:
  es-data:

input {
  beats { port => 5044 }
}

filter {
  # Promote the fields our backend logs (level, message, service) to top-level, easy-to-search names.
  if [app][level] {
    mutate {
      add_field => {
        "level"   => "%{[app][level]}"
        "service" => "%{[app][service]}"
      }
    }
  }
  if [app][@timestamp] {
    date { match => ["[app][@timestamp]", "ISO8601"] target => "@timestamp" }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "shop-logs-%{+YYYY.MM.dd}"
  }
}

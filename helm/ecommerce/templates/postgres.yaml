apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shop-postgres-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.postgres.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-postgres
  labels: { app: shop-postgres }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: shop-postgres }
  template:
    metadata:
      labels: { app: shop-postgres }
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports: [{ containerPort: 5432 }]
          env:
            - { name: POSTGRES_USER, value: shop }
            - { name: POSTGRES_DB, value: shop }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: shop-secret, key: DB_PASSWORD } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "shop", "-d", "shop"] }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: shop-postgres-data }
---
apiVersion: v1
kind: Service
metadata:
  name: shop-postgres
spec:
  selector: { app: shop-postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
